[versions]
junit5 = "5.10.0"
junit5-platform = "1.10.0"
junit6 = "6.0.2"
kotlin = "2.1.0"
kotlinx-coroutines = "1.9.0"

[libraries]
junit5-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit5" }
junit5-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit5-platform" }
junit6-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit6" }
junit6-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit6" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
